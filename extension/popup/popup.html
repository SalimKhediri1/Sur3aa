<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      min-height: 200px;
      background: #1C2033;
      color: #ffffff;
      font-family: sans-serif;
      font-size: 13px;
    }
    #header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 14px 16px;
      border-bottom: 1px solid #8B0000;
    }
    #header img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    #header span {
      font-size: 15px;
      font-weight: 600;
      color: #FF4444;
    }
    #job-list {
      padding: 10px 12px;
    }
    .empty-state {
      text-align: center;
      color: #666;
      padding: 40px 0;
      font-size: 13px;
    }
    .job-card {
      background: rgba(204,0,0,0.08);
      border: 1px solid rgba(204,0,0,0.25);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .job-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }
    .job-url {
      font-size: 11px;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .job-status {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .status-pending { background: rgba(204,0,0,0.2); color: #FF4444; }
    .status-done { background: rgba(0,200,100,0.15); color: #86efac; }
    .status-failed { background: rgba(239,68,68,0.15); color: #fca5a5; }
    .status-cancelled { background: rgba(100,100,100,0.2); color: #aaa; }
    .progress-bar-bg {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-bottom: 6px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: #CC0000;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
    .job-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .job-detail {
      font-size: 11px;
      color: #888;
    }
    .cancel-btn {
      background: none;
      border: 1px solid #8B0000;
      border-radius: 4px;
      color: #FF4444;
      font-size: 11px;
      padding: 2px 8px;
      cursor: pointer;
      font-family: sans-serif;
    }
    .cancel-btn:hover { background: rgba(204,0,0,0.15); }
  </style>
</head>
<body>
  <div id="header">
    <img src="../icons/icon48.png" alt="Sur3aa">
    <span>Sur3aa</span>
  </div>
  <div id="job-list">
    <div class="empty-state">No active downloads</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
